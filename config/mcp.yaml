# MCP servers Nestor may use. Reviewed in git; Nestor reads it from MCP_CONFIG at startup, and an
# invalid file stops it. Every tool stays disabled until approved after review with
#   nestor mcp approve <server> <tool>
# and a changed description or schema disables it again. Risk levels come from here only.
servers:
  - name: timezone
    transport: http
    url: http://mcp-timezone:8080/mcp
    image: nestor-mcp-timezone   # built from deploy/mcp-timezone.Dockerfile
    remote: false
    credentials: none
    users: ["*"]
    timeout: 5s
    max_result_bytes: 4096
    tools:
      get_time:     { risk: read }
      convert_time: { risk: read }

  - name: google-maps
    transport: http
    url: https://mapstools.googleapis.com/mcp
    remote: true
    credentials: shared
    credential_env: GOOGLE_MAPS_API_KEY
    credential_header: X-Goog-Api-Key
    users: ["*"]
    timeout: 15s
    health_interval: 5m
    max_result_bytes: 65536
    tools:
      search_places:  { risk: read }
      lookup_weather: { risk: read }
      compute_routes: { risk: read }
